networks:
  app-network:
    driver: bridge

services:
  worker:
    environment:
      - TZ=Asia/Shanghai
    image: registry.cn-chengdu.aliyuncs.com/memeking/cron-worker:latest
    deploy:
      replicas: 3
    networks:
      - app-network
    restart: unless-stopped

  api:
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - d:/.letsencrypt/mkcert:/etc/mkcert
    image: registry.cn-chengdu.aliyuncs.com/memeking/cron-api:latest
    container_name: api
    ports:
      - "8000:80"
    command: >
      cron-api --host 0.0.0.0 --port 80
      --ssl-keyfile /etc/mkcert/key.pem
      --ssl-certfile /etc/mkcert/cert.pem
      --etcd-hosts 192.168.124.7:2379
      --mongo-url mongodb://192.168.124.7:27017
    networks:
      - app-network
    restart: unless-stopped
