services:
  # ========== 本机客户端转发（内网网卡接收游戏连接，转发公网IPv6）==========
  - name: client-main
    addr: 127.0.0.1:10999
    listener:
      type: udp
    handler:
      type: udp
    forwarders:
      - addr: "[240e:333:2cb6:4000:6951:7793:2ab0:c4ce]:10999"

  - name: client-cave
    addr: 127.0.0.1:10998
    listener:
      type: udp
    handler:
      type: udp
    forwarders:
      - addr: "[240e:333:2cb6:4000:6951:7793:2ab0:c4ce]:10998"
